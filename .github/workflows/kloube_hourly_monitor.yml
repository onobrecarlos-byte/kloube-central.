name: Kloube Monitor Integrado
on:
  schedule:
    # Try every five minutes away from the start of the hour. The worker
    # only checks domains once the configured monitoring interval has elapsed.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kloube-monitor-integrado
  cancel-in-progress: false
jobs:
  verify-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar domínios e notificar novas quedas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KLOUBE_GITHUB_REPO: ${{ github.repository }}
          KLOUBE_GITHUB_BRANCH: ${{ github.ref_name }}
          KLOUBE_ENABLE_PC_MONITOR: '0'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          KLOUBE_SMTP_PASS: ${{ secrets.KLOUBE_SMTP_PASS }}
        run: |
          if [ -z "$NOTION_API_KEY" ]; then
            echo "::error::Cadastre NOTION_API_KEY nos Secrets do GitHub Actions."
            exit 1
          fi
          python check_cli.py
